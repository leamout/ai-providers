name: Tag v0.1.0

on:
  push:
    branches: [main]
    paths: [".github/workflows/tag-v0.1.0.yml"]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create v0.1.0
        run: |
          if git rev-parse v0.1.0 >/dev/null 2>&1; then
            echo "v0.1.0 already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.1.0 70d1137810e0b434fa78a7d7819ad17c45f9c929 -m "Leamout AI Providers v0.1.0"
          git push origin v0.1.0
